<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevOps portfolio template that lists your public GitHub repositories.">
    <title>DevOps Portfolio</title>
    <link rel="stylesheet" href="custom-styles.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <nav aria-label="Primary">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="hero" id="home">
            <div class="container">
                <h1>Your Name</h1>
                <p>Cloud Architect &amp; DevOps Engineer</p>
            </div>
        </section>

        <section id="projects" class="container">
            <h2>GitHub Projects</h2>
            <div class="projects-grid" id="projects-container" aria-live="polite"></div>
        </section>

        <section id="contact" class="container">
            <h2>Contact Me</h2>
            <!-- Static template: wire the form to a backend or a form service before use. -->
            <form class="contact-form" id="contactForm">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Name" autocomplete="name" required>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
                <p id="form-status" role="status"></p>
            </form>
            <div class="socials">
                <a href="https://github.com/YOUR_GITHUB_USERNAME" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/YOUR_LINKEDIN_USERNAME" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </section>
    </main>

    <script src="fetching-github-profile.js"></script>
</body>
</html>
